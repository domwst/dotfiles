"$schema" = 'https://starship.rs/config-schema.json'

# Colours are referenced by role (base, surface0, peach, green_bg, ...); each palette below fills
# the same roles, so switching themes is just this line.
palette = "tokyonight_night"

format = """
$os$username$hostname\
$directory\
$git_branch$git_status$git_state\
$c$rust$golang$nodejs$java$kotlin$haskell$python$php\
$docker_context\
$fill\
$memory_usage$cmd_duration$status$time
$character"""

# Result line printed by fish's transient prompt (config.fish) when a prompt collapses:
# the finished command's duration and exit code (when notable) and its finish time.
[profiles]
result = "$cmd_duration$status${env_var.STARSHIP_FINISHED}"

[env_var.STARSHIP_FINISHED]
format = '[ $env_value](fg:overlay1)'

[fill]
symbol = " "

[os]
disabled = false
format = '[](fg:surface0)[$symbol ](fg:text bg:surface0)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
format = '[$user](fg:text bg:surface0)'

[hostname]
format = '[@$hostname](fg:text bg:surface0)'

[directory]
format = '[](fg:surface0 bg:peach_bg)[ $path$read_only](fg:peach bg:peach_bg)[](fg:peach_bg) '
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = ""
format = '[](fg:green_bg)[$symbol $branch](fg:green bg:green_bg)'

[git_status]
format = '[( $all_status$ahead_behind)](fg:green bg:green_bg)[](fg:green_bg) '

[git_state]
format = '[](fg:yellow_bg)[$state( $progress_current/$progress_total)](fg:yellow bg:yellow_bg)[](fg:yellow_bg) '

[c]
symbol = ""
format = '[](fg:teal_bg)[$symbol( $version)](fg:teal bg:teal_bg)[](fg:teal_bg) '

[rust]
symbol = ""
format = '[](fg:teal_bg)[$symbol( $version)](fg:teal bg:teal_bg)[](fg:teal_bg) '

[golang]
symbol = ""
format = '[](fg:teal_bg)[$symbol( $version)](fg:teal bg:teal_bg)[](fg:teal_bg) '

[nodejs]
symbol = ""
format = '[](fg:teal_bg)[$symbol( $version)](fg:teal bg:teal_bg)[](fg:teal_bg) '

[java]
symbol = ""
format = '[](fg:teal_bg)[$symbol( $version)](fg:teal bg:teal_bg)[](fg:teal_bg) '

[kotlin]
symbol = ""
format = '[](fg:teal_bg)[$symbol( $version)](fg:teal bg:teal_bg)[](fg:teal_bg) '

[haskell]
symbol = ""
format = '[](fg:teal_bg)[$symbol( $version)](fg:teal bg:teal_bg)[](fg:teal_bg) '

[python]
symbol = ""
format = '[](fg:teal_bg)[$symbol( $version)](fg:teal bg:teal_bg)[](fg:teal_bg) '

[php]
symbol = ""
format = '[](fg:teal_bg)[$symbol( $version)](fg:teal bg:teal_bg)[](fg:teal_bg) '

[docker_context]
symbol = ""
format = '[](fg:blue_bg)[$symbol $context](fg:blue bg:blue_bg)[](fg:blue_bg) '

[memory_usage]
disabled = false
threshold = 70
format = '[](fg:lavender_bg)[ $ram_pct](fg:lavender bg:lavender_bg)[](fg:lavender_bg) '

[cmd_duration]
min_time = 300
show_milliseconds = true
format = '[](fg:blue_bg)[ $duration](fg:blue bg:blue_bg)[](fg:blue_bg) '

[status]
disabled = false
format = '[](fg:red_bg)[✘ $status](fg:red bg:red_bg)[](fg:red_bg) '

[time]
disabled = false
time_format = "%R"
format = '[](fg:mauve_bg)[ $time](fg:mauve bg:mauve_bg)[](fg:mauve_bg) '

[character]
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:mauve)'
vimcmd_replace_symbol = '[](bold fg:mauve)'
vimcmd_visual_symbol = '[](bold fg:lavender)'

# TokyoNight Night (Ghostty: theme = TokyoNight Night). *_bg are tints of each accent for the soft pills.
