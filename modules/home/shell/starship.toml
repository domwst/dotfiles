"$schema" = 'https://starship.rs/config-schema.json'

# Colours are referenced by role (base, surface0, peach, green_bg, ...); each palette below fills
# the same roles, so switching themes is just this line.
palette = "tokyonight_night"

# The blank line above the info line is part of `format`
add_newline = false

# First line: the previous command's result (duration and exit code when notable, finish time).
# fish renders it once when the command finishes, using the `result` profile below (config.fish),
# so it stays exactly where it is when the prompt collapses after Enter.
format = """
(${env_var.STARSHIP_RESULT}
)
$os$username$hostname\
$directory\
$git_branch$git_status$git_state\
$c$rust$golang$nodejs$java$kotlin$haskell$python$php\
$docker_context\
$fill\
$memory_usage
$character"""

[profiles]
result = "$cmd_duration$status${env_var.STARSHIP_FINISHED}"

[env_var.STARSHIP_RESULT]
format = "$env_value"

[env_var.STARSHIP_FINISHED]
format = '[ $env_value](fg:overlay1)'

[fill]
symbol = " "

[os]
disabled = false
format = '[](fg:surface0)[$symbol ](fg:text bg:surface0)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
format = '[$user ](fg:text bg:surface0)'

[hostname]
format = '[@$hostname ](fg:text bg:surface0)'

[directory]
format = '[](fg:surface0 bg:peach)[ $path$read_only](fg:base bg:peach)[](fg:peach) '
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " "

[git_branch]
symbol = ""
format = '[](fg:green)[$symbol $branch](fg:base bg:green)'

[git_status]
format = '[( $all_status$ahead_behind)](fg:base bg:green)[](fg:green) '

[git_state]
format = '[](fg:yellow)[$state( $progress_current/$progress_total)](fg:base bg:yellow)[](fg:yellow) '

[c]
symbol = ""
format = '[](fg:teal)[$symbol( $version)](fg:base bg:teal)[](fg:teal) '

[rust]
symbol = ""
format = '[](fg:teal)[$symbol( $version)](fg:base bg:teal)[](fg:teal) '

[golang]
symbol = ""
format = '[](fg:teal)[$symbol( $version)](fg:base bg:teal)[](fg:teal) '

[nodejs]
symbol = ""
format = '[](fg:teal)[$symbol( $version)](fg:base bg:teal)[](fg:teal) '

[java]
symbol = ""
format = '[](fg:teal)[$symbol( $version)](fg:base bg:teal)[](fg:teal) '

[kotlin]
symbol = ""
format = '[](fg:teal)[$symbol( $version)](fg:base bg:teal)[](fg:teal) '

[haskell]
symbol = ""
format = '[](fg:teal)[$symbol( $version)](fg:base bg:teal)[](fg:teal) '

[python]
symbol = ""
format = '[](fg:teal)[$symbol( $version)](fg:base bg:teal)[](fg:teal) '

[php]
symbol = ""
format = '[](fg:teal)[$symbol( $version)](fg:base bg:teal)[](fg:teal) '

[docker_context]
symbol = ""
format = '[](fg:blue)[$symbol $context](fg:base bg:blue)[](fg:blue) '

[memory_usage]
disabled = false
threshold = 70
format = '[](fg:lavender)[ $ram_pct](fg:base bg:lavender)[](fg:lavender) '

[cmd_duration]
min_time = 300
show_milliseconds = true
format = '[](fg:blue)[ $duration](fg:base bg:blue)[](fg:blue) '

[status]
disabled = false
format = '[](fg:red)[✘ $status](fg:base bg:red)[](fg:red) '


[character]
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:mauve)'
vimcmd_replace_symbol = '[](bold fg:mauve)'
vimcmd_visual_symbol = '[](bold fg:lavender)'

# TokyoNight Night (Ghostty: theme = TokyoNight Night). *_bg are accent tints, used by soft pills.
