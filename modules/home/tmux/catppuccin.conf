set -g @catppuccin_flavor "mocha"

# TokyoNight Night colours for the catppuccin status bar: the plugin only sets its @thm_*
# options when they're unset, so these win over the flavour above. Comments: tokyonight.nvim names
set -g @thm_bg "#1a1b26"         # bg
set -g @thm_fg "#c0caf5"         # fg
set -g @thm_rosewater "#c0caf5"  # fg
set -g @thm_flamingo "#f7768e"   # red
set -g @thm_pink "#bb9af7"       # magenta
set -g @thm_mauve "#9d7cd8"      # purple
set -g @thm_red "#f7768e"        # red
set -g @thm_maroon "#db4b4b"     # red1
set -g @thm_peach "#ff9e64"      # orange
set -g @thm_yellow "#e0af68"     # yellow
set -g @thm_green "#9ece6a"      # green
set -g @thm_teal "#73daca"       # green1
set -g @thm_sky "#7dcfff"        # cyan
set -g @thm_sapphire "#2ac3de"   # blue1
set -g @thm_blue "#7aa2f7"       # blue
set -g @thm_lavender "#89ddff"   # blue5
set -g @thm_subtext_1 "#a9b1d6"  # fg_dark
set -g @thm_subtext_0 "#a9b1d6"  # fg_dark
set -g @thm_overlay_2 "#737aa2"  # dark5
set -g @thm_overlay_1 "#565f89"  # comment
set -g @thm_overlay_0 "#545c7e"  # dark3
set -g @thm_surface_2 "#414868"  # terminal_black
set -g @thm_surface_1 "#3b4261"  # fg_gutter
set -g @thm_surface_0 "#292e42"  # bg_highlight
set -g @thm_mantle "#16161e"     # bg_dark
set -g @thm_crust "#0c0e14"      # bg_dark1

set -g @catppuccin_window_status_style "slanted"
set -g @catppuccin_directory_text "#{pane_current_path}"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -g @catppuccin_window_text " #{pane_current_command}"
set -g @catppuccin_window_current_text " #{pane_current_command}"
